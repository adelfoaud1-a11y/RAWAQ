#151517;border-radius:11px;padding:9px 11px;font-size:11px;color:#ddd8d3}.secondary-btn:hover{background:#252527}.not-ready{min-height:260px;display:grid;place-items:center;text-align:center;padding:28px;color:#b9b3ae;line-height:2}.not-ready b{font-size:16px;color:#f2ece5}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

            <button class="nav-color" id="nextColor" aria-label="اللون التالي">›</button>

<script>
const catalog=window.RAWAQ_CATALOG;
const models=catalog.models;
let activeModel=models[0],activeColor=0,activeView='front',query='';
let photoRequest=0;
const expandedDescriptions=new Set();
const $=id=>document.getElementById(id);
const normalize=s=>String(s||'').toLocaleLowerCase('ar').normalize('NFD').replace(/[\u064B-\u065F\u0670]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/[×xX]/g,'x').replace(/\s+/g,' ').trim();
const formatColor=n=>String(n).padStart(2,'0');
function currentVariant(){return activeModel.variants[activeColor]||null}
function revealProductImage(){const hero=$('hero');const r=hero.getBoundingClientRect();const topbar=document.querySelector('.topbar').getBoundingClientRect().bottom;if(r.bottom<=topbar||r.top<topbar||r.top>=window.innerHeight){const target=Math.max(0,window.scrollY+r.top-topbar-8);window.scrollTo({top:target,behavior:'smooth'})}}
function setActiveModel(id,colorIndex=null){
 const model=models.find(m=>m.id===id)||models[0];
 if(model!==activeModel)activeView='front';
 activeModel=model;
 activeColor=colorIndex===null?Math.min(activeColor,Math.max(model.variants.length-1,0)):colorIndex;
 render();
 revealProductImage();
}
function variantForQuery(model,q){if(/^\d{1,2}$/.test(q)){const n=Number(q);return model.variants.find(v=>v.colorNumber===n)||null}if(/^\d{11}$/.test(q))return model.variants.find(v=>v.sku===q)||null;return model.variants.find(v=>normalize(v.colorName).includes(q))||null}
function searchMatches(model,q){if(!q)return true;const base=normalize([model.name,model.designName,model.code,model.id,model.size,model.fabricType,model.fabricCatalog,model.boxType].join(' '));if(base.includes(q))return true;return model.variants.some(v=>normalize([v.sku,v.colorNumber,v.colorName,v.size,v.fabricType,v.fabricCatalog].join(' ')).includes(q))}
function drawModelCards(list=models){$('modelStrip').innerHTML=list.map(m=>`<button class="model-card ${m.id===activeModel.id?'active':''}" data-model="${m.id}"><img src="${m.mainImage}" alt="${m.name}" loading="lazy"><b>${m.name}</b><small>${m.code||m.id}</small></button>`).join('');document.querySelectorAll('.model-card').forEach(btn=>btn.addEventListener('click',()=>{setActiveModel(btn.dataset.model);$('modelStrip').classList.remove('open');$('toggleModels').setAttribute('aria-expanded','false')}))}
function syncPilotDescription(){const open=expandedDescriptions.has(activeModel.id);const panel=$('descriptionExpanded');panel.classList.toggle('open',open);panel.setAttribute('aria-hidden',String(!open));panel.toggleAttribute('inert',!open);$('descriptionToggle').setAttribute('aria-expanded',String(open));$('descriptionToggle').textContent=open?'عرض أقل':'عرض المزيد'}
function windowedColors(){const all=activeModel.variants;if(all.length<=5)return all.map((v,i)=>({v,i}));const start=Math.max(0,Math.min(activeColor-2,all.length-5));return all.slice(start,start+5).map((v,j)=>({v,i:start+j}))}
function drawSwatches(){const visible=windowedColors();$('swatches').innerHTML=visible.map(({v,i})=>`<button class="swatch ${i===activeColor?'active':''}" style="--swatch:${v.swatch}" title="لون ${formatColor(v.colorNumber)} · ${v.colorName}" aria-label="اختيار اللون ${formatColor(v.colorNumber)} ${v.colorName}" aria-pressed="${i===activeColor}" data-color="${i}"></button>`).join('');document.querySelectorAll('.swatch').forEach(btn=>btn.addEventListener('click',()=>setActiveModel(activeModel.id,Number(btn.dataset.color))))}
function updatePhoto(){
 const request=++photoRequest;
 const variant=currentVariant();
 const isSide=activeView==='side';
 const isReference=!isSide && !activeModel.variants.length;
 const path=isSide?variant?.sideImage:isReference?activeModel.mainImage:variant?.frontImage;
 const angle=isSide?'الصورة الجانبية':'الصورة الرئيسية';
 const color=variant?formatColor(variant.colorNumber):'';
 const subject=variant?`${activeModel.name}، اللون ${color} (${variant.colorName})`:activeModel.name;
 const img=$('heroImage'),status=$('photoStatus'),hero=$('hero'),tag=$('photoTag'),caption=$('photoCaption');

 function showStatus(message){
  img.hidden=true;
  tag.hidden=true;
  hero.classList.remove('has-photo');
  status.textContent=message;
  status.hidden=false;
  caption.textContent='';
 }

 function showImage(){
  img.hidden=false;
  status.hidden=true;
  hero.classList.add('has-photo');
  tag.hidden=!variant;
  tag.textContent=variant?`لون ${color}`:'';
  caption.textContent=isReference?'صورة مرجعية محفوظة لهذا التصميم.':`${angle} للون المحدد.`;
 }

 if(!path){
  img.removeAttribute('src');
  showStatus(`لا تتوفر ${angle} لـ${subject}.`);
  return;
 }

 img.alt=`${angle} لـ${subject}`;
 if(img.getAttribute('src')===path && img.complete && img.naturalWidth>0){
  showImage();
  return;
 }
 showStatus(`جارٍ تحميل ${angle} لـ${subject}…`);
 img.src=path;
 img.decode().then(
  ()=>{if(request===photoRequest)showImage()},
  ()=>{if(request===photoRequest)showStatus(`تعذّر تحميل ${angle} لـ${subject}.`)}
 );
}
function render(){
 $('productName').textContent=activeModel.name;
 const isRosePilot=activeModel.code==='R009';
 $('marketingPilot').hidden=!isRosePilot;
 $('productTitleRow').hidden=isRosePilot;
 $('marketingCopy').hidden=isRosePilot;
 if(isRosePilot){$('pilotName').textContent=activeModel.name;$('pilotSummary').textContent=activeModel.marketingSummary||activeModel.marketingDescription||'';$('expandedDescription').textContent=activeModel.marketingDescription||'';syncPilotDescription()}
 const v=currentVariant();
 $('colorChip').hidden=!v;$('colorChip').textContent=v?`لون ${formatColor(v.colorNumber)}`:'';
 $('productMeta').innerHTML=v?`<div class="meta-line"><span>كود: <b dir="ltr">${v.sku || "قيد التخصيص"}</b></span><span>مقاس: <b>${v.size}</b></span></div>`:`<div class="meta-line"><span>معرّف التصميم: <b dir="ltr">${activeModel.code||activeModel.id}</b></span><span>المقاس: <b>${activeModel.size}</b></span></div>`;
 $('productDescription').textContent=activeModel.marketingDescription||'';
 const colorDescription=v?catalog.colorDescriptions?.[v.colorNumber]:'';
 $('colorCopy').hidden=!v;
 $('colorDescriptionTitle').textContent=v?`لمسة اللون · ${v.colorName}`:'';
 $('colorDescription').textContent=colorDescription||'';
 if(isRosePilot){$('expandedColorTitle').textContent=v?`اللون ${formatColor(v.colorNumber)} · ${v.colorName}`:'';$('expandedColorDescription').textContent=colorDescription||''}
 $('specs').innerHTML=(v?[activeModel.size,'مخمل · Cat 666',`لون ${formatColor(v.colorNumber)} · ${v.colorName}`]:[activeModel.size,activeModel.fabricType]).map(x=>`<span class="spec">${x}</span>`).join('');
 $('colorControls').hidden=!activeModel.variants.length;
 if(v){$('colorCurrent').textContent=`${v.colorName} · ${activeColor+1} من ${activeModel.variants.length}`;$('statusNote').textContent='المطابقة النهائية للون مع عينة المورد.';drawSwatches()}
 else $('statusNote').textContent=activeModel.detail;
 document.querySelectorAll('.thumb').forEach(b=>{const selected=b.dataset.view===activeView;b.classList.toggle('active',selected);b.classList.toggle('waiting',b.dataset.view==='side'&&!currentVariant()?.sideImage);b.setAttribute('aria-selected',String(selected))});
 updatePhoto();drawModelCards();
}
function showResults(value){query=normalize(value);const out=$('searchResults');if(!query){out.classList.remove('open');out.innerHTML='';return}
 const matches=models.filter(m=>searchMatches(m,query));
 if(!matches.length){out.innerHTML='<div class="empty-result">لا توجد منتجات مطابقة.</div>';out.classList.add('open');return}
 out.innerHTML=matches.map(m=>{const hit=variantForQuery(m,query);const sub=hit?`لون ${formatColor(hit.colorNumber)} · ${hit.colorName} · ${hit.sku}`:`${m.code||m.id} · ${m.size}`;return `<button class="search-result" data-model="${m.id}" data-color="${hit?m.variants.indexOf(hit):''}"><img src="${m.mainImage}" alt="" loading="lazy"><span><b>${m.name}</b><small>${sub}</small></span></button>`}).join('');out.classList.add('open');out.querySelectorAll('.search-result').forEach(btn=>btn.addEventListener('click',()=>{const ci=btn.dataset.color===''?null:Number(btn.dataset.color);setActiveModel(btn.dataset.model,ci);out.classList.remove('open');$('catalogSearch').blur()}))
}
function selectExactMatch(q){if(!/^\d{11}$/.test(q))return;for(const model of models){const i=model.variants.findIndex(v=>v.sku===q);if(i>=0){setActiveModel(model.id,i);return}}}
function moveColor(delta){const count=activeModel.variants.length;if(!count)return;setActiveModel(activeModel.id,(activeColor+delta+count)%count)}
document.querySelectorAll('.thumb').forEach(b=>b.addEventListener('click',()=>{activeView=b.dataset.view;render();revealProductImage()}));
$('previousColor').addEventListener('click',()=>moveColor(-1));$('nextColor').addEventListener('click',()=>moveColor(1));
$('descriptionToggle').addEventListener('click',()=>{if(expandedDescriptions.has(activeModel.id))expandedDescriptions.delete(activeModel.id);else expandedDescriptions.add(activeModel.id);syncPilotDescription()});
$('catalogSearch').addEventListener('input',e=>{const q=normalize(e.target.value);showResults(e.target.value);if(/^\d{1,2}$/.test(q)){const n=Number(q);if(n>=1&&n<=40)setActiveModel(models[0].id,n-1)}else selectExactMatch(q)});
$('catalogSearch').addEventListener('keydown',e=>{if(e.key==='Escape'){$('searchResults').classList.remove('open');e.target.blur()}if(e.key==='Enter'){$('searchResults').querySelector('.search-result')?.click()}});
$('clearSearch').addEventListener('click',()=>{$('catalogSearch').value='';showResults('');$('catalogSearch').focus()});
document.addEventListener('click',e=>{if(!e.target.closest('.search-wrap'))$('searchResults').classList.remove('open')});
$('toggleModels').addEventListener('click',()=>{const open=$('modelStrip').classList.toggle('open');$('toggleModels').setAttribute('aria-expanded',String(open));drawModelCards()});
$('hero').addEventListener('click',()=>{if(!$('heroImage').hidden&&$('heroImage').src){$('modalImage').src=$('heroImage').src;$('imageModal').classList.add('open')}});$('hero').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();$('hero').click()}});
$('closeModal').addEventListener('click',()=>$('imageModal').classList.remove('open'));$('imageModal').addEventListener('click',e=>{if(e.target===$('imageModal'))$('imageModal').classList.remove('open')});document.addEventListener('keydown',e=>{if(e.key==='Escape')$('imageModal').classList.remove('open');if(e.key==='ArrowLeft')moveColor(1);if(e.key==='ArrowRight')moveColor(-1)});
$('exportCsv').addEventListener('click',()=>{const rows=[['SKU','Design ID','Design','Color number','Color name','Size','Fabric','Catalog','Front image','Side image','Photo status'],...models.flatMap(m=>m.variants.map(v=>[v.sku,m.id,m.name,v.colorNumber,v.colorName,v.size,v.fabricType,v.fabricCatalog,v.frontImage||'',v.sideImage||'',v.status]))];const csv='\uFEFF'+rows.map(r=>r.map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download='RAWAQ_R009_CAT666_90x190.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)});
render();
</script>
</body>
</html>
